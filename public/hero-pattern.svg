<svg width="1920" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    </pattern>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1920" height="600" fill="url(#heroGrad)"/>
  <rect width="1920" height="600" fill="url(#grid)"/>
  <circle cx="200" cy="150" r="80" fill="rgba(255,255,255,0.05)"/>
  <circle cx="1700" cy="450" r="120" fill="rgba(255,255,255,0.05)"/>
  <circle cx="1500" cy="100" r="60" fill="rgba(255,255,255,0.05)"/>
</svg>
