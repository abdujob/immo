server {
    listen 80;
    server_name immosenegal.sn www.immosenegal.sn api.immosenegal.sn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name immosenegal.sn www.immosenegal.sn;

    ssl_certificate /etc/letsencrypt/live/immosenegal.sn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immosenegal.sn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api.immosenegal.sn;

    ssl_certificate /etc/letsencrypt/live/immosenegal.sn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immosenegal.sn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
